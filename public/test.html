<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main.css" />
    <title>HangMan Game</title>
  </head>
  <body>
    <div class="auth-container">
      <h2>Create Account</h2>
      <input type="text" id="username" placeholder="Username" />
      <input type="password" id="password" placeholder="Password" />
      <button id="registerBtn">Register</button>
      <button id="loginBtn">Login</button>
      <p id="auth-message"></p>
    </div>
    <div class="container">
      <div class="game-info">
        <div class="game-name">HangMan</div>
        <div class="category">Word from : <span></span></div>
      </div>
      <hr />
      <div class="row">
        <div class="hangMan-draw">
          <div class="the-draw">
            <div class="the-stand"></div>
            <div class="the-hang"></div>
            <div class="the-rop"></div>
            <div class="the-Man">
              <div class="the-head"></div>
              <div class="the-body"></div>
              <div class="hands"></div>
              <div class="legs"></div>
            </div>
          </div>
        </div>
        <div class="letters"></div>
      </div>
      <hr />
      <div class="letters-guess"></div>
    </div>
    <audio id="success" src="sound/win.mp3" preload="auto"></audio>
    <audio id="failed" src="sound/loose.mp3" preload="auto"></audio>
    <script src="test.js"></script>
  </body>
</html>
